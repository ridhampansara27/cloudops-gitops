apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  # Root Application dedicated exclusively to the OCI OKE cluster.
  name: cloudops-oci-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ridhampansara27/cloudops-gitops.git
    targetRevision: main

    # OCI applications live in an isolated directory so this root
    # cannot install AWS-specific controllers or AWS platform resources.
    path: argocd/oci-applications

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Automatically reconcile only Application CR definitions.
  # Individual child applications decide whether workloads auto-sync.
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true