apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    # Use the official Prometheus Community Helm repository.
    repoURL: https://prometheus-community.github.io/helm-charts

    chart: kube-prometheus-stack

    # Pin the chart for reproducible deployments.
    targetRevision: "87.21.0"

    helm:
      releaseName: kube-prometheus-stack

      values: |
        grafana:
          enabled: true

          defaultDashboardsEnabled: true

          persistence:
            enabled: false

        prometheus:
          enabled: true

          prometheusSpec:
            retention: 24h

            resources:
              requests:
                cpu: 200m
                memory: 512Mi

              limits:
                cpu: 1000m
                memory: 1Gi

        alertmanager:
          enabled: true

        # These control-plane endpoints are not always exposed
        # in a local Kind cluster and can generate misleading alerts.
        kubeControllerManager:
          enabled: false

        kubeScheduler:
          enabled: false

        kubeEtcd:
          enabled: false

  destination:
    server: https://kubernetes.default.svc

    namespace: monitoring

    # Configure how Argo CD synchronizes the monitoring application.
  syncPolicy:

    # Automatically synchronize the desired state.
    automated:

      # Enable automatic synchronization.
      enabled: true

      # Delete resources removed from the desired state.
      prune: true

      # Automatically correct manual changes in Kubernetes.
      selfHeal: true

      # Prevent an empty application from being accepted.
      allowEmpty: false

    # Configure additional synchronization behavior.
    syncOptions:

      # Create the monitoring namespace when required.
      - CreateNamespace=true

      # Use Server-Side Apply for the large Prometheus Operator CRDs.
      - ServerSideApply=true

    # Retry failed synchronization attempts.
    retry:

      # Maximum number of retries.
      limit: 5

      # Configure exponential retry backoff.
      backoff:

        # Initial retry delay.
        duration: 10s

        # Double the delay after every failed attempt.
        factor: 2

        # Maximum delay between retries.
        maxDuration: 3m