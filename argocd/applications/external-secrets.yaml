apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  # Identify the External Secrets controller.
  name: external-secrets

  # Store the Argo Application in Argo CD.
  namespace: argocd

spec:
  # Use the default project.
  project: default

  source:
    # Use External Secrets' official Helm repository.
    repoURL: https://charts.external-secrets.io

    # Deploy the External Secrets chart.
    chart: external-secrets

    # Pin a Kubernetes 1.35-compatible release.
    targetRevision: "2.8.0"

    helm:
      # Give the Helm release a predictable name.
      releaseName: external-secrets

      values: |
        serviceAccount:
          create: true
          name: external-secrets

        installCRDs: true

  destination:
    # Deploy into the EKS cluster hosting Argo.
    server: https://kubernetes.default.svc

    # Keep secret-controller resources isolated.
    namespace: external-secrets

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
