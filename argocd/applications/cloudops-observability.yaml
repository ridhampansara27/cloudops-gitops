apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudops-observability
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/ridhampansara27/cloudops-gitops.git

    targetRevision: main

    path: observability

  destination:
    server: https://kubernetes.default.svc

    namespace: monitoring

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true