apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sealed-secrets
  namespace: argocd

spec:
  project: default

  source:
    # Official Sealed Secrets Helm repository.
    repoURL: https://bitnami.github.io/sealed-secrets

    # Pin the chart rather than following a moving latest release.
    targetRevision: 2.20.0

    chart: sealed-secrets

    helm:
      releaseName: sealed-secrets

      values: |
        # Match the controller name expected by kubeseal by default.
        fullnameOverride: sealed-secrets-controller

        # Keep resource use conservative on the single A1 worker.
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  # Intentionally no automated sync.
  #
  # The OCI root application may create/update this Application CR,
  # but the Sealed Secrets controller will only be installed after an
  # explicit reviewed manual sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
