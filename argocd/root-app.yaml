apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudops-root
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/ridhampansara27/cloudops-gitops.git

    targetRevision: main

    # This directory will contain child Argo Application manifests.
    path: argocd/applications

    directory:
    # Discover child Argo CD applications.
    recurse: true

    # cloudops-dev is for the local development cluster.
    # EKS must use cloudops-aws-dev instead.
    exclude: cloudops-dev.yaml

  destination:
    # Child Application CRs are created in the Argo cluster.
    server: https://kubernetes.default.svc

    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true