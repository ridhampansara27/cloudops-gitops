# CloudOps Insight OCI development environment.
environment: oci-dev


# ------------------------------------------------------------
# Commercial browser runtime
# ------------------------------------------------------------

runtime:
  # Application lifecycle identity is independent from OCI naming.
  appEnv: staging

  # Use the branded apex hostname as the canonical application URL.
  frontendBaseUrl: "https://cloudopsinsight.tech"

  # Allow only the canonical production origin.
  corsOrigins: "https://cloudopsinsight.tech"

  # Canonical AWS IAM user used by the OCI backend bootstrap credentials.
  #
  # STS GetCallerIdentity was verified from the live backend before this
  # value was introduced. Customer trust policies may reference this
  # non-secret IAM principal ARN.
  awsPlatformPrincipalArn: "arn:aws:iam::902664897666:user/cloudops-oci-bootstrap"

  # Keep public registration disabled after controlled fresh-user E2E validation.
  publicSignupEnabled: false
  # Transactional authentication email delivery.
  smtp:
    host: "smtp.resend.com"
    port: 587
    fromEmail: "no-reply@notify.cloudopsinsight.tech"
    fromName: "CloudOps Insight"
    starttls: true
    timeoutSeconds: 10

  # Browser refresh sessions must use a host-only HTTPS cookie.
  refreshCookie:
    secure: true
    sameSite: "lax"
    path: "/api/v1/auth"
    domain: ""

  # OKE public traffic reaches the frontend through Cloudflare Tunnel.
  rateLimit:
    enabled: true
    trustCloudflareConnectingIp: true


# ------------------------------------------------------------
# Backend
# ------------------------------------------------------------

backend:
  replicaCount: 1

  image:
    repository: "ghcr.io/ridhampansara27/cloudops-insight-backend"
    tag: "sha-bc5d723db36f4cb063fed760bbe9fd7042a16fb7"
    pullPolicy: IfNotPresent


# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------

frontend:
  replicaCount: 1

  image:
    repository: "ghcr.io/ridhampansara27/cloudops-insight-frontend"
    tag: "sha-d04f1f4ed8373a9a29bc54fef1f75a097ff3c183"
    pullPolicy: IfNotPresent


# ------------------------------------------------------------
# Celery
# ------------------------------------------------------------

worker:
  replicaCount: 1

beat:
  replicaCount: 1


# ------------------------------------------------------------
# OCI PostgreSQL storage
# ------------------------------------------------------------

postgres:
  image: "docker.io/library/postgres:17-alpine"

  database: cloudops
  username: cloudops

  storage:
    # OCI Block Volume CSI provisions a minimum 50 GiB volume.
    # Request the real allocation explicitly rather than 2 GiB.
    size: 50Gi

    storageClassName: "oci-bv"


# ------------------------------------------------------------
# Redis
# ------------------------------------------------------------

redis:
  # Redis remains ephemeral in OCI.
  image: "docker.io/library/redis:7-alpine"


# ------------------------------------------------------------
# Runtime Secret
# ------------------------------------------------------------

secrets:
  # This Secret will be created separately before application sync.
  # No secret material is stored in Git.
  existingSecret: cloudops-secrets


# ------------------------------------------------------------
# AWS bootstrap identity
# ------------------------------------------------------------

awsBootstrap:
  # OCI cannot use EKS Pod Identity.
  # Supply only the minimal bootstrap credentials required
  # to assume the configured AWS read-only discovery role.
  enabled: true
  existingSecret: cloudops-aws-bootstrap


# ------------------------------------------------------------
# OCI workload identity
# ------------------------------------------------------------

serviceAccount:
  create: true

  # Do not reuse the AWS-specific ServiceAccount name.
  name: cloudops-runtime


# ------------------------------------------------------------
# Public routing
# ------------------------------------------------------------

ingress:
  # Cloudflare Tunnel will route directly to the frontend ClusterIP.
  # No OCI Load Balancer, NodePort or ingress controller is required.
  enabled: false


# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------

autoscaling:
  # One fixed backend replica is intentional on the single A1 worker.
  enabled: false

  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70


# ------------------------------------------------------------
# Single-node cluster behavior
# ------------------------------------------------------------

podDisruptionBudget:
  # A minAvailable=1 PDB can obstruct voluntary maintenance
  # when the cluster contains only one worker.
  enabled: false


networkPolicy:
  # OKE currently uses Flannel Overlay.
  # Do not claim NetworkPolicy enforcement until a policy-capable
  # networking implementation is intentionally installed.
  enabled: false

# ------------------------------------------------------------
# Cloudflare Tunnel connector
# ------------------------------------------------------------

cloudflared:
  enabled: true

  replicaCount: 1

  # Credential remains an externally provisioned Kubernetes Secret.
  existingSecret: cloudflared-tunnel-token

  nodeSelector:
    kubernetes.io/arch: arm64

# ------------------------------------------------------------
# PostgreSQL logical-backup upload credential
# ------------------------------------------------------------

postgresBackup:
  # Deploy the backup workload in OCI.
  enabled: true

  # Final intended production schedule: 02:15 UTC daily.
  schedule: "15 2 * * *"
  timeZone: "Etc/UTC"

  # Backup creation and isolated restore have both been validated.
  # Enable the recurring production schedule.
  suspend: false

  serviceAccountName: cloudops-postgres-backup

  databaseHost: cloudops-postgres
  databasePort: 5432

  # Must exactly match the scope enforced by the OCI PAR.
  objectPrefix: "logical/postgres/oci-dev/"


  uploadSecret:
    # OCI-only encrypted upload credential.
    # The plaintext Object Storage PAR URL is never stored in Git.
    enabled: true

    # Strict-scope Sealed Secrets ciphertext bound to:
    #   namespace: cloudops
    #   name: cloudops-postgres-backup-upload
    encryptedParUrl: ""
