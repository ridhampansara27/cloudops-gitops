{{- if .Values.postgresBackup.enabled }}

apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ required "postgresBackup.serviceAccountName is required" .Values.postgresBackup.serviceAccountName | quote }}

  labels:
    app.kubernetes.io/name: cloudops-insight
    app.kubernetes.io/component: postgres-backup
    app.kubernetes.io/managed-by: Helm

# The backup workload never needs to call the Kubernetes API.
# Do not inject a Kubernetes bearer token into its Pods.
automountServiceAccountToken: false

{{- end }}
