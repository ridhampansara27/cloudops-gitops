apiVersion: batch/v1
kind: Job

metadata:
  name: "{{ .Release.Name }}-migration"

  annotations:
    # Execute migration as part of the Argo synchronization.
    argocd.argoproj.io/hook: Sync

    # Run migration after PostgreSQL/Redis but before applications.
    argocd.argoproj.io/sync-wave: "-1"

    # Recreate the migration Job every deployment and remove it after success.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: cloudops-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          command:
            - alembic
            - upgrade
            - head

          envFrom:
            - configMapRef:
                name: cloudops-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: JWT_SECRET