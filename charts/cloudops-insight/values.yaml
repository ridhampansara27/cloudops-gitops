# Define logical deployment environment.
environment: dev


# ------------------------------------------------------------
# Application runtime
# ------------------------------------------------------------

runtime:
  # Semantic application lifecycle environment.
  # Infrastructure-specific names such as oci-dev must not be used here.
  appEnv: development

  # Canonical browser origin used for generated application links.
  frontendBaseUrl: "http://cloudops.local"

  # Browser origins permitted to call the API.
  corsOrigins: "http://localhost:5173,http://localhost:8080,http://cloudops.local"

  # Commercial self-service signup remains fail-closed by default.
  publicSignupEnabled: false

  # Authentication email delivery.
  smtp:
    host: ""
    port: 587
    fromEmail: "no-reply@example.com"
    fromName: "CloudOps Insight"
    starttls: true
    timeoutSeconds: 10

  # Rotating refresh-session cookie configuration.
  refreshCookie:
    secure: false
    sameSite: "lax"
    path: "/api/v1/auth"
    domain: ""

  # Distributed authentication abuse protection.
  rateLimit:
    enabled: true
    trustCloudflareConnectingIp: false


# ------------------------------------------------------------
# Backend
# ------------------------------------------------------------

backend:
  replicaCount: 2

  image:
    repository: cloudops-backend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------

frontend:
  replicaCount: 2

  image:
    repository: cloudops-frontend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# Celery worker
# ------------------------------------------------------------

worker:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Celery Beat
# ------------------------------------------------------------

beat:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# PostgreSQL — local Kind only
# ------------------------------------------------------------

postgres:
  image: postgres:17-alpine

  database: cloudops

  username: cloudops

  storage:
    size: 2Gi

    # Leave empty to use the cluster default StorageClass.
    # Cloud-specific environments can select one explicitly.
    storageClassName: ""
# ------------------------------------------------------------
# Redis — local Kind only
# ------------------------------------------------------------

redis:
  image: redis:7-alpine


# ------------------------------------------------------------
# Secret references
# ------------------------------------------------------------

secrets:
  existingSecret: cloudops-secrets

# ------------------------------------------------------------
# Optional external-cloud bootstrap credentials
# ------------------------------------------------------------

awsBootstrap:
  # AWS/EKS continues using Pod Identity by default.
  enabled: false

  # Cloud-specific environments may provide this Secret.
  existingSecret: cloudops-aws-bootstrap


# ------------------------------------------------------------
# Ingress
# ------------------------------------------------------------

ingress:
  enabled: true

  className: nginx

  host: cloudops.local


# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------

autoscaling:
  enabled: true

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 70

# ------------------------------------------------------------
# Kubernetes ServiceAccount
# ------------------------------------------------------------

serviceAccount:
  # Create the application ServiceAccount through this chart.
  create: true

  # Preserve the existing AWS name by default so current
  # aws-dev rendering remains backward-compatible.
  name: cloudops-aws


# ------------------------------------------------------------
# Pod disruption budgets
# ------------------------------------------------------------

podDisruptionBudget:
  # Preserve the current behavior by default.
  enabled: true


# ------------------------------------------------------------
# Kubernetes NetworkPolicy
# ------------------------------------------------------------

networkPolicy:
  # Preserve the existing manifest by default.
  #
  # A compatible CNI/network-policy engine is still required
  # for Kubernetes to actually enforce NetworkPolicy objects.
  enabled: true


# ------------------------------------------------------------
# Cloudflare Tunnel connector
# ------------------------------------------------------------

cloudflared:
  # Disabled by default so existing local/AWS environments
  # remain completely unchanged.
  enabled: false

  replicaCount: 1

  image:
    repository: "docker.io/cloudflare/cloudflared"
    tag: "2026.9.0"
    pullPolicy: IfNotPresent

  # Tunnel credential is provisioned externally.
  # No Cloudflare token is stored in Git.
  existingSecret: cloudflared-tunnel-token

  metricsPort: 2000

  resources:
    requests:
      cpu: 20m
      memory: 32Mi

    limits:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}

# ------------------------------------------------------------
# PostgreSQL logical-backup upload credential
# ------------------------------------------------------------

postgresBackup:
  uploadSecret:
    # Disabled by default so local/AWS environments do not render
    # the OCI-specific backup uploader credential.
    enabled: false

    # Kubernetes Secret produced by the Sealed Secrets controller.
    name: cloudops-postgres-backup-upload

    # Environment-specific kubeseal ciphertext.
    #
    # Never place the plaintext OCI PAR URL in Git.
    encryptedParUrl: ""
