# Define logical deployment environment.
environment: dev


# ------------------------------------------------------------
# Backend
# ------------------------------------------------------------

backend:
  replicaCount: 2

  image:
    repository: cloudops-backend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8000

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Frontend
# ------------------------------------------------------------

frontend:
  replicaCount: 2

  image:
    repository: cloudops-frontend
    tag: local
    pullPolicy: IfNotPresent

  service:
    port: 8080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# Celery worker
# ------------------------------------------------------------

worker:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 192Mi

    limits:
      cpu: 500m
      memory: 512Mi


# ------------------------------------------------------------
# Celery Beat
# ------------------------------------------------------------

beat:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 250m
      memory: 256Mi


# ------------------------------------------------------------
# PostgreSQL — local Kind only
# ------------------------------------------------------------

postgres:
  image: postgres:17-alpine

  database: cloudops

  username: cloudops

  storage:
    size: 2Gi

    # Leave empty to use the cluster default StorageClass.
    # Cloud-specific environments can select one explicitly.
    storageClassName: ""
# ------------------------------------------------------------
# Redis — local Kind only
# ------------------------------------------------------------

redis:
  image: redis:7-alpine


# ------------------------------------------------------------
# Secret references
# ------------------------------------------------------------

secrets:
  existingSecret: cloudops-secrets

# ------------------------------------------------------------
# Optional external-cloud bootstrap credentials
# ------------------------------------------------------------

awsBootstrap:
  # AWS/EKS continues using Pod Identity by default.
  enabled: false

  # Cloud-specific environments may provide this Secret.
  existingSecret: cloudops-aws-bootstrap


# ------------------------------------------------------------
# Ingress
# ------------------------------------------------------------

ingress:
  enabled: true

  className: nginx

  host: cloudops.local


# ------------------------------------------------------------
# Autoscaling
# ------------------------------------------------------------

autoscaling:
  enabled: true

  minReplicas: 2

  maxReplicas: 5

  targetCPUUtilizationPercentage: 70

# ------------------------------------------------------------
# Kubernetes ServiceAccount
# ------------------------------------------------------------

serviceAccount:
  # Create the application ServiceAccount through this chart.
  create: true

  # Preserve the existing AWS name by default so current
  # aws-dev rendering remains backward-compatible.
  name: cloudops-aws


# ------------------------------------------------------------
# Pod disruption budgets
# ------------------------------------------------------------

podDisruptionBudget:
  # Preserve the current behavior by default.
  enabled: true


# ------------------------------------------------------------
# Kubernetes NetworkPolicy
# ------------------------------------------------------------

networkPolicy:
  # Preserve the existing manifest by default.
  #
  # A compatible CNI/network-policy engine is still required
  # for Kubernetes to actually enforce NetworkPolicy objects.
  enabled: true


# ------------------------------------------------------------
# Cloudflare Tunnel connector
# ------------------------------------------------------------

cloudflared:
  # Disabled by default so existing local/AWS environments
  # remain completely unchanged.
  enabled: false

  replicaCount: 1

  image:
    repository: "docker.io/cloudflare/cloudflared"
    tag: "2026.9.0"
    pullPolicy: IfNotPresent

  # Tunnel credential is provisioned externally.
  # No Cloudflare token is stored in Git.
  existingSecret: cloudflared-tunnel-token

  metricsPort: 2000

  resources:
    requests:
      cpu: 20m
      memory: 32Mi

    limits:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
