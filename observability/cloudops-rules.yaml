apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: cloudops-application-rules

  namespace: monitoring

  labels:
    # Allow kube-prometheus-stack Prometheus to discover this rule.
    release: kube-prometheus-stack

spec:
  groups:

    - name: cloudops.availability

      rules:

        # ----------------------------------------------------
        # Backend unavailable
        # ----------------------------------------------------

        - alert: CloudOpsBackendUnavailable

          expr: |
            kube_deployment_status_replicas_available{
              namespace="cloudops",
              deployment="cloudops-backend"
            } < 1

          for: 2m

          labels:
            severity: critical
            application: cloudops-insight

          annotations:
            summary: "CloudOps Insight backend is unavailable"

            description: >-
              The CloudOps Insight backend Deployment has had
              zero available replicas for more than two minutes.


        # ----------------------------------------------------
        # Frontend unavailable
        # ----------------------------------------------------

        - alert: CloudOpsFrontendUnavailable

          expr: |
            kube_deployment_status_replicas_available{
              namespace="cloudops",
              deployment="cloudops-frontend"
            } < 1

          for: 2m

          labels:
            severity: critical
            application: cloudops-insight

          annotations:
            summary: "CloudOps Insight frontend is unavailable"

            description: >-
              The CloudOps Insight frontend Deployment has had
              zero available replicas for more than two minutes.