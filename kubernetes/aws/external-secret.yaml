# Use the stable External Secrets API.
apiVersion: external-secrets.io/v1

# Synchronize an external AWS secret into Kubernetes.
kind: ExternalSecret

metadata:
  # Identify this synchronization resource.
  name: cloudops-runtime

  # Create the resulting Kubernetes Secret here.
  namespace: cloudops

spec:
  # Periodically refresh the Kubernetes Secret from AWS.
  refreshInterval: 1h

  # Use the AWS SecretStore created above.
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    # This exact name is already expected by the Helm chart.
    name: cloudops-secrets

    # ExternalSecret owns the generated Kubernetes Secret.
    creationPolicy: Owner

  # Extract all JSON properties from one AWS Secrets Manager secret.
  dataFrom:
    - extract:
        key: /cloudops/dev/application