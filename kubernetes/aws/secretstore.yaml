# Use the stable External Secrets API.
apiVersion: external-secrets.io/v1

# SecretStore defines how ESO connects to AWS Secrets Manager.
kind: SecretStore

metadata:
  # Name referenced by the ExternalSecret below.
  name: aws-secrets-manager

  # Store belongs to the CloudOps workload namespace.
  namespace: cloudops

spec:
  provider:
    aws:
      # Read secrets from AWS Secrets Manager.
      service: SecretsManager

      # CloudOps infrastructure is running in Frankfurt.
      region: eu-central-1