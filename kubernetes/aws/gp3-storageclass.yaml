# Use the Kubernetes StorageClass API.
apiVersion: storage.k8s.io/v1

# Define a StorageClass for dynamically provisioned EBS volumes.
kind: StorageClass

metadata:
  # Name used by PersistentVolumeClaims.
  name: gp3

  annotations:
    # Mark this StorageClass as the default for PVCs that do not
    # explicitly specify storageClassName.
    storageclass.kubernetes.io/is-default-class: "true"

# Use the Amazon EBS CSI driver.
provisioner: ebs.csi.aws.com

# Delete the EBS volume when its PersistentVolume is deleted.
reclaimPolicy: Delete

# Create the EBS volume only after Kubernetes knows which node
# will consume the volume. This avoids Availability Zone mismatch.
volumeBindingMode: WaitForFirstConsumer

# Allow the volume to be resized later if required.
allowVolumeExpansion: true

parameters:
  # Use modern General Purpose SSD volumes.
  type: gp3

  # Use the ext4 filesystem on the provisioned volume.
  csi.storage.k8s.io/fstype: ext4